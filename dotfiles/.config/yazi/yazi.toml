# Minimal overrides for the latest stable Yazi release.
# Unspecified settings continue to use Yazi's built-in defaults.

[mgr]
ratio = [ 1, 4, 3 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
show_hidden = true
show_symlink = true
scrolloff = 5

[preview]
wrap = "yes"
tab_size = 2
